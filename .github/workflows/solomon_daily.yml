name: Engine
on:
  workflow_dispatch:
    inputs:
      upload_enabled:
        description: "Upload final video to YouTube"
        required: true
        type: boolean
        default: false
  repository_dispatch:
    types: [new_topic]
jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: sudo apt-get install -y ffmpeg
      - name: Add dispatched topic to topics.txt
        if: github.event_name == 'repository_dispatch'
        env:
          TOPIC: ${{ github.event.client_payload.topic }}
        run: |
          if [ -z "$TOPIC" ]; then
            echo "client_payload.topic bos, durduruluyor." >&2
            exit 1
          fi
          if ! grep -qxF "$TOPIC" topics.txt 2>/dev/null; then
            echo "$TOPIC" >> topics.txt
          fi
      - run: python main.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FORCE_TOPIC: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.topic || '' }}
          UPLOAD_ENABLED: ${{ github.event_name == 'repository_dispatch' && 'true' || inputs.upload_enabled }}
      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aitube2-output-${{ github.run_number }}
          if-no-files-found: warn
          path: output/
      - name: Persist topics.txt and islenmis.txt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics.txt islenmis.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Kayit degisikligi yok."
          else
            git commit -m "Update topics and processed log"
            git push
          fi

      - name: Hata bildirimi gonder (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID yok, bildirim atlaniyor."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT=$(printf '⚠️ Workflow basarisiz\nRepo: %s\nWorkflow: %s\nRun: %s' \
            "${{ github.repository }}" "${{ github.workflow }}" "$RUN_URL")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$TEXT" \
            || echo "Telegram bildirimi gonderilemedi (workflow yine de basarisiz olarak isaretli kalir)."
